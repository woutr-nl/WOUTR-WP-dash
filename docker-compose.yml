services:
  app:
    build: .
    init: true
    # Loopback only: the app must be reached through Rollout's proxy, never directly.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      ADMIN_USER: ${ADMIN_USER:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      BRICKS_LICENSE_KEY: ${BRICKS_LICENSE_KEY:?}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: woutrdash
      POSTGRES_DB: woutrdash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woutrdash"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  dbdata:
  appdata:
